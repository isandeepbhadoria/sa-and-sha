name: Check Production Health

# Manually-triggered diagnostic — hits the live site from a runner with
# normal internet access, since this sandbox's own network egress is
# blocked for the production domain. Useful for confirming what's actually
# deployed without asking a human to dig through DevTools first.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Frontend — headers (cache/last-modified)
        run: |
          echo "--- HEAD https://sa-and-sha.com/ ---"
          curl -sS -I https://sa-and-sha.com/
      - name: Frontend — fetch index.html and locate the built JS bundle
        run: |
          curl -sS https://sa-and-sha.com/ -o /tmp/index.html
          echo "--- index.html (first 4000 chars) ---"
          head -c 4000 /tmp/index.html
          echo
          echo "--- script src(s) referencing /assets/ ---"
          grep -oE '/assets/[A-Za-z0-9._-]+\.js' /tmp/index.html | sort -u
      - name: Frontend — fetch the bundle and check for GA4/Meta Pixel wiring
        run: |
          BUNDLE=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/index.html | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "Could not find a main JS bundle reference in index.html"
            exit 0
          fi
          echo "--- Bundle: $BUNDLE ---"
          curl -sS "https://sa-and-sha.com${BUNDLE}" -o /tmp/bundle.js
          echo "--- Bundle size ---"
          wc -c /tmp/bundle.js
          echo "--- googletagmanager string present? ---"
          grep -c "googletagmanager" /tmp/bundle.js || true
          echo "--- GA4 measurement ID pattern (G-XXXXXXXXXX) present? ---"
          grep -oE 'G-[A-Z0-9]{6,12}' /tmp/bundle.js | sort -u || echo "none found"
          echo "--- connect.facebook.net string present? ---"
          grep -c "connect.facebook.net" /tmp/bundle.js || true
          echo "--- Meta Pixel ID-looking numeric sequences near fbq init (first 3) ---"
          grep -oE "fbq\('init',\s*'[0-9]+'\)" /tmp/bundle.js | head -3 || echo "pattern not found (likely minified differently)"
